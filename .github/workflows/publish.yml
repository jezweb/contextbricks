name: Publish contextbricks to npm

# Publishes with npm Trusted Publishing (OIDC): no NPM_TOKEN secret.
# npmjs.com > contextbricks > Settings > Trusted Publishing trusts
# user jezweb, repository contextbricks, workflow publish.yml.
# Provenance is attached automatically.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC token for npm Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds

      - name: Check npm supports Trusted Publishing (11.5.1 or later)
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION, node $(node --version)"
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1); }
          ' "$NPM_VERSION"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing contextbricks v$PKG_VERSION"

      - name: Publish to npm
        run: npm publish
